<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rick · 训练决策挑战</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#172b46;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:28px 20px 60px}header{display:flex;justify-content:space-between;align-items:center;font-weight:850;letter-spacing:1px}small,.muted{color:#708098}h1{font-size:clamp(30px,6vw,52px);line-height:1.15;margin:24px 0 12px}p{line-height:1.8}.pill{font-size:12px;border-radius:30px;padding:8px 13px;background:#e7edff;color:#3262de}.hero{margin:32px 0;padding:30px;border-radius:26px;background:#fff;box-shadow:0 12px 40px #1c386608}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.stat{padding:16px;border-radius:16px;background:#f1f5fc}.stat b{display:block;font-size:24px;margin-bottom:4px}.bar{height:6px;background:#e1e8f2;border-radius:9px;margin:20px 0}.bar i{display:block;background:#416bfa;height:100%;border-radius:9px;transition:width .3s}.tag{color:#526de0;font-size:13px;font-weight:700}h2{font-size:26px;line-height:1.4}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:15px;background:#f3f6fb;border-radius:13px}.metric b{display:block;margin-top:7px;font-size:18px}.options{display:grid;gap:12px;margin:24px 0}button{font:inherit;cursor:pointer;border:0}button.option{text-align:left;padding:18px;background:white;border:1.5px solid #dce4ef;border-radius:14px;color:#243b59;line-height:1.5}button.option:hover{border-color:#416bfa;background:#f5f7ff}button.option.selected{border-color:#416bfa;background:#eaf0ff}button.option.correct{border-color:#1e9c80;background:#e4f6ee}button:disabled{cursor:default}.primary{background:#315ee9;color:white;border-radius:13px;padding:15px 24px;font-weight:750}.secondary{background:#eaf0fa;color:#33517a;border-radius:13px;padding:15px 22px;margin-left:10px}.feedback{padding:22px;border-radius:16px;background:#edf4ff;margin:20px 0}.feedback h3{margin:0}.feedback p{margin-bottom:0}.foot{font-size:12px;color:#8390a3;margin-top:28px}.hidden{display:none}.review{border-top:1px solid #e1e8f2;padding:18px 0}a{color:#315ee9}button:focus-visible{outline:3px solid #a6baff;outline-offset:3px}@media(max-width:500px){.hero{padding:22px 18px}.stat{padding:12px}.stat b{font-size:20px}.secondary{margin:10px 0 0}.metrics{gap:8px}}
</style><main><header><span>RICK <small>/ COACH LAB</small></span><span class="pill">训练决策挑战</span></header><nav aria-label="学习工具系列" style="display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 0;font-size:13px"><a href="./quiz-series/" style="background:#254e42;color:#fffefa;text-decoration:none;padding:10px 15px;border-radius:9px">学习卡片 · 60 题题库系列 ↗</a><a href="./session-card/" style="padding:10px 15px">会员课前询问卡 ↗</a></nav><div id="app"></div><p class="foot">虚构教学案例 · 比较个人基线，结合体感与热身表现 · 分数用于学习，不是临床或设备诊断。</p></main><script>
const cases=[
{tag:'01 / 恢复与体感',title:'HRV正常，就能放心冲吗？',story:'会员今天安排高强度骑行。前天练腿，昨晚加班；本人说：“手表看起来还行，但腿有点沉。”没有急性疼痛或疾病症状。',metrics:[['昨晚睡眠','5小时'],['夜间HRV','在个人基线范围'],['静息心率','比平时高5次/分'],['热身反馈','腿沉，用力感偏高']],opts:['按原计划完成间歇，HRV正常就够了','先低强度热身复评，必要时改轻松骑或缩短训练','取消未来一周训练，等待指标全部完美','改成大重量腿部训练，避开有氧'],points:[0,20,5,0],why:'HRV只是一个线索。短睡眠、静息心率上移和热身用力感偏高，共同提示今天可能承受不了原定强度。先复评，再降强度或训练量，比机械照表更合理。',tip:'继续追问：腿沉是在缓解还是加重？相同功率下心率和RPE是否异常？若出现不适，应终止训练并进一步评估。'},
{tag:'02 / 数据与现实',title:'准备度很高，膝盖却在抗议',story:'会员准备做跳跃循环训练。手表训练准备度很高，但下楼时膝前侧疼，徒手蹲会重现疼痛。',metrics:[['训练准备度','88 / 100'],['睡眠','8小时'],['身体信号','下楼膝痛'],['动作检查','徒手蹲重现疼痛']],opts:['准备度高，按计划跳跃','充分热身后用意志力完成','暂停诱发疼痛的动作，选择耐受活动并评估问题','把跳跃次数减半，仍做同样动作'],points:[0,0,20,5],why:'全身恢复指标不能判断局部组织是否适合承受跳跃负荷。疼痛已在日常活动和动作中出现，应该先暂停诱发动作，了解疼痛和功能变化。',tip:'若疼痛持续、加重，或出现明显肿胀、卡锁、不能负重等情况，应寻求医疗评估。不要凭准备度给局部疼痛放行。'},
{tag:'03 / 负荷冲突',title:'每堂课都合理，排在一起呢？',story:'一位兼顾增肌和骑行的会员，周一重腿、周二骑行间歇、周三又重腿。最近两周腿部表现下降，上肢表现稳定，睡眠基本正常。',metrics:[['周一','大重量腿部'],['周二','高强度骑行'],['周三','再次大重量腿部'],['趋势','腿部表现连续下降']],opts:['增加腿部训练组数，突破平台','优先拉开腿部高负荷日，减少本周腿部总负荷并观察','只要每次换项目，就没有恢复冲突','停掉所有上肢训练'],points:[0,20,0,0],why:'换项目不等于换组织。骑行间歇和重腿都可能增加下肢疲劳，连续堆叠可能影响后续训练质量。结合表现趋势，优先调整排期和总量。',tip:'随后用相近条件下的力量表现、骑行输出和RPE复查；不要只盯着总训练分钟数。'},
{tag:'04 / 趋势判读',title:'HRV一天变低，需要停练吗？',story:'会员夜间HRV低于平时，但只出现一晚。静息心率与睡眠正常，没有不适；热身时动作、心率反应和体感均如常。今天计划中等强度力量训练。',metrics:[['HRV','单晚偏低'],['静息心率','正常'],['主观恢复','感觉良好'],['热身表现','和平时一致']],opts:['仅凭这一晚HRV，取消全部训练','把训练加倍，证明身体没问题','核对测量和近期趋势，按热身反应训练并保留调整余地','以后不再看HRV'],points:[5,0,20,0],why:'单次偏低可能来自正常波动或测量条件。其他信号和热身表现稳定时，可保留计划并动态调整，不必用一个数字一票否决。',tip:'观察后续几天的个人趋势；若同时出现体感恶化、表现下降或疾病症状，再重新评估。'},
{tag:'05 / 训练现场',title:'同样重量，今天突然很吃力',story:'会员平常深蹲工作组为80公斤×6，约RPE7。今天同样重量第一组已接近RPE9，速度明显变慢，动作仍可控，没有疼痛。',metrics:[['平时工作组','80kg × 6 / RPE7'],['今天第一组','80kg × 6 / RPE9'],['动作速度','明显变慢'],['今日目标','保持动作质量']],opts:['必须完成原定重量和全部组数','充分休息后复评，减重或减组，让努力程度回到目标范围','立刻测试1RM，确认实力','把剩余组都做到力竭'],points:[0,20,0,0],why:'计划重量只是起点，实际努力程度才反映当天这组的成本。先检查休息、热身和技术，再调整重量或组数，有助于维持训练质量。',tip:'RPE9表示大约还剩1次可完成重复，但估计存在误差。结合动作和速度，避免假装RPE是精密仪器。'},
{tag:'06 / 综合决策',title:'减量后回暖，该立即补课吗？',story:'会员因疲劳减量了三天。今天睡得好、精神回升，静息心率接近基线；还未做训练热身。会员想一次补回之前少练的所有组数。',metrics:[['最近三天','主动减量'],['主观状态','明显改善'],['静息心率','接近个人基线'],['训练表现','尚未复评']],opts:['一次补完所有缺失训练量','永远保持减量，不再增加训练','先热身复评，逐步恢复正常训练，继续观察次日反应','状态好就直接挑战个人纪录'],points:[0,5,20,0],why:'恢复好转支持重新评估训练，不代表可以一次偿还“训练债”。先确认实际表现，再逐步回到可承受的正常训练量。',tip:'下一天的疲劳、局部不适和表现变化，是判断恢复安排是否合适的重要反馈。'}
];let idx=0,answers=[],selected=null,revealed=false;const app=document.getElementById('app');let best=0;try{best=+localStorage.getItem('rick-best')||0}catch(e){}function home(){app.innerHTML=`<section class="hero"><span class="tag">HERACLES LAB · 第一季</span><h1>数字会说话，<br>你来做决定。</h1><p class="muted">扮演现场教练，在恢复、疼痛和训练负荷之间，做出更有依据的选择。</p><div class="stats"><div class="stat"><b>6</b><small>真实感情景</small></div><div class="stat"><b>5分钟</b><small>完成一轮</small></div><div class="stat"><b>${best}</b><small>历史最高 / 120</small></div></div><button class="primary" onclick="start()">开始挑战 →</button><p class="foot">每关选择一个当前最合理的方案。提交后揭晓得分、判断依据和下一步观察点。</p></section>`}function start(){idx=0;answers=[];selected=null;revealed=false;render()}function render(){const c=cases[idx];app.innerHTML=`<div class="bar"><i style="width:${idx/6*100}%"></i></div><section class="hero"><span class="tag">${c.tag} · 第 ${idx+1} / 6 关</span><h2>${c.title}</h2><p>${c.story}</p><div class="metrics">${c.metrics.map(m=>`<div class="metric"><small>${m[0]}</small><b>${m[1]}</b></div>`).join('')}</div><p class="muted">你会如何安排？</p><div class="options">${c.opts.map((o,i)=>`<button class="option ${selected===i?'selected':''} ${revealed&&c.points[i]===20?'correct':''}" ${revealed?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}．${o}</button>`).join('')}</div>${revealed?`<div class="feedback" role="status"><h3>${c.points[selected]===20?'✓ 判断到位':c.points[selected]>0?'有可取之处，但还可更好':'再看看关键线索'} · +${c.points[selected]}分</h3><p>${c.why}</p><p><b>教练追问：</b>${c.tip}</p></div><button class="primary" onclick="next()">${idx===5?'查看挑战报告':'下一关 →'}</button>`:`<button class="primary" onclick="submit()" ${selected===null?'disabled style="opacity:.45"':''}>确认决策</button>`}</section>`}function choose(i){if(revealed)return;selected=i;render()}function submit(){if(selected===null||revealed)return;revealed=true;answers.push(selected);render()}function next(){if(idx===5){finish();return}idx++;selected=null;revealed=false;render();window.scrollTo({top:0,behavior:'smooth'})}function finish(){let score=answers.reduce((s,a,i)=>s+cases[i].points[a],0);best=Math.max(best,score);try{localStorage.setItem('rick-best',best)}catch(e){}app.innerHTML=`<section class="hero"><span class="tag">挑战完成 / COACH REPORT</span><h1>${score} <small style="font-size:22px">/ 120</small></h1><h2>${score>=100?'训练决策领航员':score>=70?'稳步进阶的教练':'好判断，从复盘开始'}</h2><p>关键不是追逐满分，而是建立判断顺序：<b>先看安全与症状，再结合个人趋势、体感和现场表现，最后调整计划。</b></p>${cases.map((c,i)=>`<div class="review"><b>${c.title} · ${c.points[answers[i]]} / 20</b><p class="muted">你的选择：${c.opts[answers[i]]}<br>推荐选择：${c.opts[c.points.indexOf(20)]}</p><p>${c.why}</p></div>`).join('')}<button class="primary" onclick="start()">再挑战一次 ↻</button><button class="secondary" onclick="home()">返回首页</button></section>`;window.scrollTo({top:0,behavior:'smooth'})}home();
</script></html>
